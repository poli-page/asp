# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for poli-page repos. PRs here are mostly opened and fixed by automated agents
# (the poli-page auto loop and issue pipeline), which read CodeRabbit's findings and its commit status.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  allow_author_approval: true
  # The summary goes in the walkthrough, never in the PR description: the merge gate reads the description.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  # The loop decides "reviewed this head" from the CodeRabbit commit status ("Review completed").
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  # PR labels are the closed issues' labels; CodeRabbit only suggests.
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  auto_review:
    enabled: true
    drafts: false
    # Every push of a fix round must be reviewed, and never auto-paused (the loop allows up to 5 rounds).
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/packages.lock.json"
    - "!**/TestResults/**"
    - "!**/artifacts/**"
    - "!**/*.nupkg"
    - "!**/*.snupkg"
  path_instructions:
    - path: "src/PoliPage.AspNetCore/**"
      instructions: >-
        Published NuGet package (net8.0 / net10.0). Keep the public API surface stable and consistent
        with the other poli-page framework integrations; flag breaking changes that are not part of a
        major version bump. SDK exceptions must map to RFC 7807 ProblemDetails, and the API error
        shape ({ error: { code } }) must not be lost. Public members need XML docs.
    - path: "tests/**"
      instructions: >-
        Every public result, helper and exception-handling path needs a test. Unit tests must not hit
        the network (use the stub HTTP handler fixtures); real-API tests belong in the IntegrationTests
        project, tagged Category=Integration and skipped when POLI_PAGE_API_KEY is unset.
    - path: "example-app/**"
      instructions: >-
        Sample code that customers copy: it must be correct, idiomatic ASP.NET Core (Minimal APIs and
        MVC), and must never contain real secrets. API keys come from configuration or environment
        variables, never hard-coded. Keep it consistent with the README and docs/*.md.
    - path: "**/*.md"
      instructions: >-
        Code samples in README, docs/ and MIGRATION.md must compile against the current public API and
        match the example-app; CHANGELOG.md must record user-visible changes.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md

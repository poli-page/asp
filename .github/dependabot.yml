version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Dependabot waits 3 days after a release by default; the API contract is exempt, so a new
    # contract version arrives the next day and its CI run shows what the API change breaks.
    cooldown:
      default-days: 3
      exclude:
        - "poli-page/api-contract"
    groups:
      api-contract:
        patterns:
          - "poli-page/api-contract"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "poli-page/api-contract"

  # Directory.Packages.props pins every NuGet package (the PoliPage SDK, the example app's and
  # the tests' dependencies) for the whole solution.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project still targets net8.0. Runtime packages 11.x don't support net8.0,
      # so stay on the 10.x line (serviced until Nov 2028) until net8.0 is dropped.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: ["version-update:semver-major"]
      # SourceLink 11 pulls System.IO.Hashing 11, which doesn't support net8.0 either
      # (fails the net8.0 build under -warnaserror).
      - dependency-name: "Microsoft.SourceLink.*"
        update-types: ["version-update:semver-major"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Required by codecov-action's tokenless (OIDC) upload on public repos:
    # Codecov rejects plain tokenless uploads on the default (protected)
    # branch, so OIDC is the way. Mirrors the sdk-csharp setup.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  tfm: net8.0 }
          - { os: ubuntu-latest,  tfm: net10.0 }
          - { os: windows-latest, tfm: net8.0 }
          - { os: windows-latest, tfm: net10.0 }
          - { os: macos-latest,   tfm: net10.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { path: asp }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0

      - name: Restore
        run: dotnet restore asp/PoliPage.AspNetCore.sln

      - name: Format check
        run: dotnet format asp/PoliPage.AspNetCore.sln --verify-no-changes

      # Build the whole solution without a global -f: every project builds its declared
      # TargetFrameworks (net8.0;net10.0), which Pack needs from the library.
      - name: Build
        run: dotnet build asp/PoliPage.AspNetCore.sln -c Release --no-restore

      # Unit tests, then the example-app tests: the API contract's impl cases (which fail
      # when POLI_CONTRACT is missing, since CI is set) and the stub-backed demo test. The
      # live-API tests are Category=Integration and need a sandbox key, so they are excluded.
      - name: Test
        # Force bash on every OS: the line-continuation (\) syntax below is not valid in
        # PowerShell, the default shell on windows-latest.
        shell: bash
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          dotnet test asp/tests/PoliPage.AspNetCore.Tests/PoliPage.AspNetCore.Tests.csproj \
            -c Release --no-build \
            -f ${{ matrix.tfm }} \
            --filter "Category!=Integration" \
            --collect "XPlat Code Coverage"
          dotnet test asp/tests/PoliPage.AspNetCore.IntegrationTests/PoliPage.AspNetCore.IntegrationTests.csproj \
            -c Release --no-build \
            -f ${{ matrix.tfm }} \
            --filter "Category!=Integration"

      # Pack the library only. It multi-targets net8.0;net10.0 and the no-`-f` build above
      # produced both, so NuGet finds every lib/<tfm> asset (no NU5026).
      - name: Pack
        run: dotnet pack asp/src/PoliPage.AspNetCore/PoliPage.AspNetCore.csproj -c Release --no-build

      # Single canonical upload (Ubuntu / net10.0) so the report isn't
      # quadruple-counted across the matrix. `use_oidc: true` authenticates
      # via the GitHub-issued OIDC token instead of a long-lived upload
      # token. Codecov rejects plain tokenless uploads on the default
      # branch ("Token required because branch is protected"); OIDC avoids
      # both that rejection and the secret-rotation overhead.
      # `working-directory: asp` runs the uploader at the repo root: the
      # checkout above lands in the `asp` subfolder of the workspace.
      - name: Upload coverage to Codecov
        if: matrix.tfm == 'net10.0' && matrix.os == 'ubuntu-latest' && hashFiles('**/coverage.cobertura.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          working-directory: asp
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
          use_oidc: true
